name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vis Xcode-version
        run: xcodebuild -version

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Generer Xcode-projekt
        run: xcodegen generate

      - name: Byg
        run: |
          set -o pipefail
          xcodebuild \
            -project MinApp.xcodeproj \
            -scheme MinApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Pak IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/MinApp.app
          test -d "$APP/PlugIns/MinAppWidget.appex" || { echo "Widget extension mangler i appen"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry MinApp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MinApp
          path: MinApp.ipa
          if-no-files-found: error
