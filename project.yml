name: MinApp

options:
  bundleIdPrefix: com.louis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Ingen code signing – appen bygges usigneret på CI
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  MinApp:
    type: application
    platform: iOS
    sources:
      - MinApp
      - Shared
    info:
      path: MinApp/Info.plist
      properties:
        CFBundleDisplayName: MinApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.louis.MinApp
    dependencies:
      - target: MinAppWidget
        embed: true
    scheme: {}

  MinAppWidget:
    type: app-extension
    platform: iOS
    sources:
      - MinAppWidget
      - Shared
    info:
      path: MinAppWidget/Info.plist
      properties:
        CFBundleDisplayName: MinAppWidget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # Skal have appens bundle id som prefix for at kunne embeddes
        PRODUCT_BUNDLE_IDENTIFIER: com.louis.MinApp.MinAppWidget
        SKIP_INSTALL: "YES"
